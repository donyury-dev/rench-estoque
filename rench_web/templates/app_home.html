<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#850001">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Suprimentos">
  <link rel="manifest" href="{{url_for('static', filename='manifest_app.json')}}?v=1">
  <link rel="icon" href="{{url_for('static', filename='logo_app.png')}}?v=1">
  <link rel="apple-touch-icon" href="{{url_for('static', filename='logo_app.png')}}?v=1">
  <title>RENCH Suprimentos e Equipamentos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#f4f4f5;min-height:100vh;display:flex;flex-direction:column;}
    .topo{background:#850001;color:#fff;padding:28px 20px 22px;text-align:center;}
    .topo img{width:72px;height:72px;border-radius:16px;background:#fff;padding:6px;margin-bottom:10px;}
    .topo h1{font-size:19px;font-weight:800;}
    .topo p{font-size:13px;opacity:.85;margin-top:4px;}
    .conteudo{flex:1;padding:20px 16px;display:flex;flex-direction:column;gap:14px;max-width:480px;margin:0 auto;width:100%;}
    .card-app{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:20px 18px;text-decoration:none;color:inherit;border:1px solid #eee;box-shadow:0 2px 6px rgba(0,0,0,.05);}
    .card-app:active{transform:scale(.98);}
    .card-icone{width:54px;height:54px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;flex-shrink:0;}
    .card-app h2{font-size:16px;font-weight:800;color:#222;}
    .card-app p{font-size:12.5px;color:#777;margin-top:2px;}
    .btn-instalar{display:none;margin-top:6px;background:#850001;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;width:100%;cursor:pointer;}
    .dica{font-size:12px;color:#888;text-align:center;margin-top:4px;line-height:1.5;}
    .rodape{padding:14px;text-align:center;font-size:12px;color:#999;}
    .rodape a{color:#850001;text-decoration:none;font-weight:700;}
  </style>
</head>
<body>
  <div class="topo">
    <img src="{{url_for('static', filename='logo_app.png')}}?v=1" alt="RENCH">
    <h1>Suprimentos e Equipamentos</h1>
    <p>Escolha o que deseja consultar</p>
  </div>

  <div class="conteudo">
    <a class="card-app" href="{{url_for('suprimento_mobile')}}">
      <div class="card-icone" style="background:#850001;"><i class="bi bi-printer"></i></div>
      <div>
        <h2>Suprimentos</h2>
        <p>Estoque, entrega, entrada e histórico</p>
      </div>
    </a>

    <a class="card-app" href="{{url_for('mobile_equipamentos')}}">
      <div class="card-icone" style="background:#650001;"><i class="bi bi-pc-display"></i></div>
      <div>
        <h2>Equipamentos</h2>
        <p>Impressoras, computadores e movimentações</p>
      </div>
    </a>

    <button class="btn-instalar" id="btnInstalar"><i class="bi bi-download"></i> Instalar aplicativo</button>
    <p class="dica">Para instalar: menu do navegador &rarr; <strong>Instalar aplicativo</strong> / <strong>Adicionar &agrave; tela de in&iacute;cio</strong></p>
  </div>

  <div class="rodape"><a href="{{url_for('index')}}">Abrir sistema completo</a></div>

  <script>
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('btnInstalar').style.display = 'block';
    });
    document.getElementById('btnInstalar').addEventListener('click', async () => {
      if(!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      document.getElementById('btnInstalar').style.display = 'none';
    });
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('{{url_for("static", filename="sw.js")}}?v=8');
    }
  </script>
</body>
</html>
